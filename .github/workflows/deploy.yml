name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_history:
        description: Refetch all completed seasons to pick up historical corrections
        type: boolean
        default: false
  schedule:
    # 10:23 UTC is 2:23 AM PST / 3:23 AM PDT.
    - cron: '23 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ASTRO_TELEMETRY_DISABLED: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for qualifier updates
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify qualifier parser
        run: python3 -m unittest discover -s tests -v

      - name: Refresh NorCal qualifier assignments
        timeout-minutes: 30
        run: python3 scripts/update-qualifiers.py

      - name: Restore saved team ratings and completed-season history
        id: ratings-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            src/data/team-ratings.json
            .cache/team-history.json
          key: ratings-v1-${{ hashFiles('scripts/update-team-ratings.py', 'src/data/team-rating-rubric.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ratings-v1-${{ hashFiles('scripts/update-team-ratings.py', 'src/data/team-rating-rubric.json') }}-

      - name: Refresh historical team ratings
        if: github.event_name != 'push'
        timeout-minutes: 20
        env:
          REFRESH_HISTORY: ${{ inputs.refresh_history }}
        run: |
          if [ "$REFRESH_HISTORY" = "true" ]; then
            python3 scripts/update-team-ratings.py --refresh-history
          else
            python3 scripts/update-team-ratings.py
          fi

      - name: Build
        run: npm run build

      - name: Save refreshed team ratings and completed-season history
        if: github.event_name != 'push'
        uses: actions/cache/save@v5
        with:
          path: |
            src/data/team-ratings.json
            .cache/team-history.json
          key: ${{ steps.ratings-cache.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
